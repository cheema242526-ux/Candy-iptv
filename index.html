<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Candy IPTV">
<title>Candy IPTV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{
  --bg:#120A24;--bg2:#1A0F33;--panel:#221543;--panel2:#2E1D57;--line:#3D2A6E;
  --ink:#F4EFFF;--muted:#A897CF;--accent:#8B5CF6;--accent2:#C084FC;
  --ok:#34D399;--warn:#FBBF24;--bad:#F87171;
  color-scheme:dark;box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1100px 560px at 0% -10%,#2B1460 0%,transparent 60%),radial-gradient(900px 500px at 110% 0%,#1B2370 0%,transparent 55%),var(--bg);background-attachment:fixed;overflow-x:hidden}
body.noscroll{overflow:hidden}
#app{max-width:1280px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.muted{color:var(--muted)}

/* top bars */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
.tt{flex:1;min-width:0}
.tt h1{font-size:1.2rem;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{display:block;color:var(--muted);font-size:.8rem}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none;padding:0}
.ib.sm{width:38px;height:38px;border-radius:12px;background:none;border:0;color:var(--muted)}
.ib.fav,.btn.fav{color:#FACC15}

/* home */
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}
.brand svg{width:38px;height:38px}
.clock{text-align:right;line-height:1.2}
.clock b{display:block;font-size:1.35rem;font-weight:600}
.clock span{font-size:.78rem;color:var(--muted)}
.rail{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 8px;padding:4px 14px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar,.chips::-webkit-scrollbar,.p-tools::-webkit-scrollbar,.gprogs::-webkit-scrollbar,.seasons::-webkit-scrollbar{display:none}
.rb{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;padding:11px 4px;border-radius:18px;border:1px solid var(--line);background:rgba(46,29,87,.6);font-size:.7rem;color:var(--muted)}
.rb .ic{width:22px;height:22px;color:var(--ink)}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:#FDE68A;margin-bottom:12px;font-size:.9rem}
.banner.bad{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.45);color:#FECACA}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border:0;border-radius:24px;padding:18px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 28px -14px rgba(0,0,0,.8);overflow:hidden;transition:transform .1s}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.tile:active{transform:scale(.97)}
.tile-ic{position:absolute;top:16px;left:16px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile-ic .ic{width:24px;height:24px}
.tile-l{font-weight:700;font-size:1.15rem}
.tile-s{font-size:.78rem;opacity:.85;margin-top:2px}
.t-live{background:linear-gradient(135deg,#3557FF,#1631C9)}
.t-movie{background:linear-gradient(135deg,#F0525A,#B8232B)}
.t-series{background:linear-gradient(135deg,#4ACB5F,#23963A)}
.t-epg{background:linear-gradient(135deg,#4C8DF6,#2559D6)}
.t-catch{background:linear-gradient(135deg,#F7A23B,#DD7410)}
.t-multi{background:linear-gradient(135deg,#A24BF2,#6A1FD0)}
.tile.off{filter:saturate(.25) brightness(.65)}
.cw{margin-top:12px;width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:20px;border:1px solid rgba(192,132,252,.6);background:linear-gradient(135deg,#6D3BF5,#3B4BF2);color:#fff;font-weight:600;text-align:left;box-shadow:0 0 24px -6px rgba(139,92,246,.7)}
.cw .ci{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.cw span{flex:1;min-width:0}
.cw small{display:block;font-weight:400;opacity:.85;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media(min-width:800px){.stats{grid-template-columns:repeat(6,1fr)}}
.chip{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,#8B5CF6);flex:none}
.chip div{min-width:0}
.chip span{display:block;color:var(--muted);font-size:.72rem}
.chip b{display:block;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* browse */
.split{display:block}
.split .items{display:none}
.split.has-items .cats{display:none}
.split.has-items .items{display:block}
@media(min-width:800px){
  .split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  .split .cats,.split.has-items .cats{display:block;position:sticky;top:12px;max-height:calc(100vh - 100px);overflow:auto}
  .split .items{display:block}
}
.cat{display:flex;align-items:center;border-radius:14px;margin-bottom:6px;background:var(--panel)}
.cat.on{background:linear-gradient(135deg,#7C3AED,#A855F7)}
.cat-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 12px;background:none;border:0;text-align:left}
.cat-main .ic{width:18px;height:18px;color:var(--accent2)}
.cat.on .cat-main .ic{color:#fff}
.cat-main .ic.lk{color:var(--warn)}
.cat-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.cat-c{font-size:.75rem;color:var(--muted)}
.cat.on .cat-c{color:#EDE4FF}
.cat-more{background:none;border:0;padding:10px 12px;color:var(--muted)}
.ibar{display:flex;gap:8px;margin-bottom:12px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0}
.sbox .ic{width:18px;height:18px;color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;background:none;padding:12px 0;outline:none;font-size:16px}
.sbox.big{margin-bottom:14px}
select{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 10px;font-size:.88rem;max-width:42%}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:16px;padding-right:4px}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 10px;background:none;border:0;text-align:left}
.num{width:32px;text-align:center;font-size:.78rem;color:var(--muted);flex:none}
.logo{width:46px;height:46px;border-radius:12px;background:#0E0820;display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0E0820}
.logo .ic{color:var(--muted)}
.row-n{flex:1;min-width:0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-n small{display:block;font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.68rem;padding:3px 8px;border-radius:999px;background:rgba(245,158,11,.18);color:#FCD34D;flex:none}
.badge{font-size:.68rem;padding:3px 8px;border-radius:999px;background:rgba(52,211,153,.18);color:var(--ok);flex:none}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
@media(min-width:800px){.posters{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.poster{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.pimg{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#2E1D57,#140B2B);display:grid;place-items:center;width:100%}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pfb{font-size:2rem;font-weight:700;color:rgba(255,255,255,.22)}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.55)}
.pbar i{display:block;height:100%;background:var(--accent2)}
.pname{font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prate{font-size:.72rem;color:#FCD34D}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.92rem}
.btn .ic{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,#8B5CF6,#6D28D9);border-color:transparent;color:#fff}
.btn.danger{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.5);color:#FECACA}
.btn.big{width:100%;padding:15px;font-size:1.02rem;margin-top:6px}
.btn.more{width:100%;margin-top:12px}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.sec{margin:20px 0 10px;font-size:1rem;font-weight:600}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 12px;line-height:1.5}
.pad{padding:4px 12px 10px}

/* detail */
.detail{display:grid;gap:18px}
@media(min-width:800px){.detail{grid-template-columns:240px 1fr}}
.dposter{aspect-ratio:2/3;width:min(200px,55vw);border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#2E1D57,#140B2B);position:relative;display:grid;place-items:center}
@media(min-width:800px){.dposter{width:100%}}
.dposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detail h2{margin:0 0 10px;font-size:1.5rem;line-height:1.2}
.metas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.meta{font-size:.76rem;padding:5px 10px;border-radius:999px;background:var(--panel);color:var(--muted)}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.plot{color:#DDD3F5;line-height:1.65;max-width:65ch;margin:0 0 12px}
.kv{color:var(--muted);font-size:.88rem;line-height:1.55;margin:0 0 6px;max-width:70ch}
.kv b{color:var(--ink);font-weight:500;margin-right:6px}
.seasons,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.seasons{margin:18px 0 12px}
.chips{margin:0 -14px 12px;padding:0 14px 4px}
.pill{flex:none;padding:9px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--panel);border:0;text-align:left;width:100%;margin-bottom:6px}
.ep-th{width:104px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0E0820;position:relative;flex:none;display:grid;place-items:center;color:var(--muted)}
.ep-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ep-b{flex:1;min-width:0}
.ep-b b{display:block;font-weight:500;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-b span{font-size:.76rem;color:var(--muted)}

/* guide */
.grow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.gch{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:14px;background:var(--panel);border:0;font-size:.72rem;text-align:center}
.gch .logo{width:40px;height:40px}
.gch span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gprogs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.prog{flex:none;width:170px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid transparent;text-align:left;font-size:.82rem}
.prog small{display:block;color:var(--muted);font-size:.72rem;margin-bottom:4px}
.prog b{font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog.now{border-color:var(--accent);background:rgba(139,92,246,.22)}
.prog.past{opacity:.7}
.gload{color:var(--muted);font-size:.8rem;align-self:center;padding:0 8px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2)}

/* multiscreen */
.ms{display:grid;gap:4px;background:#000;border-radius:18px;overflow:hidden}
.ms.l2{grid-template-columns:1fr}
@media(min-width:800px){.ms.l2{grid-template-columns:1fr 1fr}}
.ms.l4{grid-template-columns:1fr 1fr}
.ms:fullscreen{border-radius:0;align-content:center;height:100%}
.slot{position:relative;aspect-ratio:16/9;background:#0B0618;outline:2px solid transparent;outline-offset:-2px}
.slot.focus{outline-color:var(--accent2)}
.slot video{width:100%;height:100%;object-fit:contain;display:block}
.slot-add{position:absolute;inset:0;display:grid;place-items:center;background:none;border:0;color:var(--muted);font-size:.85rem}
.slot-add .ic{width:28px;height:28px;display:block;margin:0 auto 6px}
.slot-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:4px;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:.72rem}
.slot-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-bar button{background:rgba(255,255,255,.15);border:0;border-radius:8px;padding:5px 8px;font-size:.7rem}

/* settings & checks */
.set{background:var(--panel);border-radius:20px;padding:6px;margin-bottom:14px}
.set h3{font-size:.82rem;color:var(--muted);margin:10px 12px 6px;font-weight:500}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border-radius:14px;background:none;border:0;text-align:left}
.srow .ic{color:var(--accent2)}
.srow span{flex:1;min-width:0}
.srow small{color:var(--muted)}
.sw{width:46px;height:28px;border-radius:999px;background:#3B2C61;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(18px)}
.check{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);margin-bottom:8px}
.check .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:#3B2C61}
.check .st .ic{width:16px;height:16px}
.check .st.ok{background:rgba(52,211,153,.2);color:var(--ok)}
.check .st.bad{background:rgba(248,113,113,.2);color:var(--bad)}
.check div{flex:1;min-width:0}
.check b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check span{font-size:.8rem;color:var(--muted)}
.acc{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:16px;margin-bottom:8px;padding-right:6px}

/* login */
.login{max-width:460px;margin:3vh auto 0}
.brandbig{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.brandbig svg{width:58px;height:58px}
.brandbig h1{margin:0;font-size:1.7rem}
.brandbig p{margin:4px 0 0}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin:14px 0}
.seg3 button{border:0;background:none;padding:10px 4px;border-radius:12px;font-size:.82rem;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff}
.form label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:12px}
.form input,.sheet-p input[type=text],.sheet-p input[type=password],.sheet-p input[type=search],.sheet-p input[type=number]{display:block;width:100%;margin-top:6px;padding:13px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);outline:none;font-size:16px}
.form input:focus,.sheet-p input:focus{border-color:var(--accent)}
.pw{position:relative;display:block}
.peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin-top:3px;background:none;border:0;color:var(--accent2);padding:8px;font-size:.85rem}
.err{color:var(--bad);min-height:1.2em;font-size:.88rem;margin:4px 0}
.link{background:none;border:0;color:var(--accent2);display:inline-flex;gap:8px;align-items:center;padding:6px 0}

/* player */
.player{position:fixed;inset:0;z-index:50;background:#05020C;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.p-top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.p-title{flex:1;min-width:0}
.p-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-stage{position:relative;background:#000;width:100%;aspect-ratio:16/9;max-height:62vh;flex:none}
.p-stage video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.p-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(5,2,12,.88);font-size:.95rem;line-height:1.5}
.p-zap{position:absolute;top:12px;left:12px;padding:10px 14px;border-radius:14px;background:rgba(18,10,36,.88);font-weight:600;pointer-events:none}
.p-tools{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;flex:none}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:70px;padding:10px 6px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:.68rem;color:var(--muted)}
.tool .ic{color:var(--ink)}
.p-epg{padding:4px 14px 14px;overflow:auto;flex:1}
.nn{background:var(--panel);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.nn small{color:var(--accent2);font-weight:600;font-size:.72rem}
.nn b{display:block;margin:2px 0;font-weight:500}
.nn span{font-size:.8rem;color:var(--muted)}
.nn p{font-size:.82rem;color:var(--muted);line-height:1.5;margin:8px 0 0}
@media (orientation:landscape) and (max-height:520px){
  .p-stage{flex:1;aspect-ratio:auto;max-height:none}
  .p-epg{display:none}
  .p-top{padding:6px 12px}
  .p-tools{padding:6px 12px}
}
@media(min-width:900px){.p-stage{max-height:70vh}}

  if (a.type !== 'm3u') return `${a.server}/live/${enc(a.username)}/${enc(a.password)}/${i.id}.m3u8`;
  const u = i.url;
  if (/\.m3u8(\?|$)/i.test(u)) return u;
  const m = u.match(/^(https?:\/\/[^/]+)\/(?:live\/)?([^/]+)\/([^/]+)\/(\d+)(?:\.ts)?$/i);
  return m ? `${m[1]}/live/${m[2]}/${m[3]}/${m[4]}.m3u8` : u;
}
function movieSrc(i) { const a = acc(); return a.type === 'm3u' ? i.url : `${a.server}/movie/${enc(a.username)}/${enc(a.password)}/${i.id}.${i.ext || 'mp4'}`; }
function epSrc(e) { const a = acc(); return `${a.server}/series/${enc(a.username)}/${enc(a.password)}/${e.id}.${e.ext || 'mp4'}`; }
function catchSrc(id, startStr, dur) { const a = acc(); return `${a.server}/timeshift/${enc(a.username)}/${enc(a.password)}/${dur}/${startStr}/${id}.m3u8`; }
function shiftStart(p) {
  if (p.startStr && /^\d{4}-\d\d-\d\d \d\d:\d\d/.test(p.startStr)) return p.startStr.slice(0, 10) + ':' + p.startStr.slice(11, 13) + '-' + p.startStr.slice(14, 16);
  const d = new Date(p.start * 1000), z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}:${z(d.getHours())}-${z(d.getMinutes())}`;
}

const EPGC = {}, CUC = {}, INFO = {};
const normProg = e => ({ title: b64(e.title) || 'No title', desc: b64(e.description), start: +e.start_timestamp, stop: +e.stop_timestamp, startStr: e.start || '', arch: +e.has_archive === 1 });
async function getEpg(id) {
  const c = EPGC[id];
  if (c && Date.now() - c.at < 6e5) return c.list;
  try { const r = await xapi(acc(), 'get_short_epg', { stream_id: id, limit: 8 }); const list = arr(r && r.epg_listings).map(normProg).filter(p => p.start); EPGC[id] = { at: Date.now(), list }; return list; }
  catch { return []; }
}
async function loadSeriesInfo(id) {
  if (INFO['s:' + id]) return INFO['s:' + id];
  const r = await xapi(acc(), 'get_series_info', { series_id: id });
  const eps = [];
  const src = r && r.episodes;
  if (src) for (const [k, list] of Object.entries(src)) for (const e of arr(list)) {
    eps.push({ id: String(e.id), season: +(e.season || k) || 1, num: +e.episode_num || 0, title: e.title || ('Episode ' + (e.episode_num || '')), ext: e.container_extension || 'mp4', plot: (e.info && e.info.plot) || '', dur: (e.info && e.info.duration) || '', img: (e.info && e.info.movie_image) || '' });
  }
  eps.sort((a, b) => a.season - b.season || a.num - b.num);
  return INFO['s:' + id] = { info: (r && r.info) || {}, eps };
}

function lastEpOf(sid) { return Object.values(D().progress).filter(p => p.kind === 'episode' && p.seriesId === sid).sort((a, b) => b.at - a.at)[0]; }
VIEWS.series = p => {

}

let CWT = 'live';
ACT.continue = () => openSheet(cwHtml());
ACT.cwTab = d => { CWT = d.t; openSheet(cwHtml()); };
function cwHtml() {
  let body = '';
  if (CWT === 'live') {
    const l = itemsFor('live', '__recent').slice(0, 20);
    body = l.map(i => `<button class="ep" data-act="playLive" data-id="${i.id}"><span class="ep-th">${logoImg(i)}</span><span class="ep-b"><b>${esc(i.name)}</b><span>Live</span></span></button>`).join('');

  }
  return `<h3>Continue watching</h3><div class="seg3">${[['live', 'Live TV'], ['movie', 'Movies'], ['episode', 'Series']].map(([k, l]) => `<button data-act="cwTab" data-t="${k}" aria-pressed="${CWT === k}">${l}</button>`).join('')}</div>${body || '<div class="empty">Nothing here yet.</div>'}`;
}
ACT.cwPlay = d => {
  const p = D().progress[d.k]; if (!p) return;
  closeSheet();
  if (p.kind === 'movie') {
    const i = L.map.movie.get(p.id) || { id: p.id, ext: p.ext, name: p.title, icon: p.icon };
    openPlayer({ kind: 'movie', item: i, title: i.name, resumeKey: p.key, resume: true });
    return;
  }
  const s = L.map.series.get(p.seriesId) || { id: p.seriesId, name: p.title, icon: p.icon };

  const e = { id: p.id, ext: p.ext, season: p.season, num: p.num, title: p.epTitle || '' };
  openPlayer({ kind: 'episode', item: e, series: { id: s.id, name: s.name, icon: s.icon }, list: null, index: 0, title: s.name, sub: p.sub, resumeKey: p.key, resume: true });

};

VIEWS.epg = () => {
  E.list = itemsFor('live', E.cat);
  const chips = [{ id: '__fav', name: 'Favourites' }, ...visibleCats('live').map(c => ({ id: c.id, name: catName('live', c) }))];

  <div>${shown.map(i => `<div class="grow"><button class="gch" data-act="playLive" data-id="${i.id}"><span class="logo">${logoImg(i)}</span><span>${esc(i.name)}</span></button><div class="gprogs" id="g-${i.id}"><span class="gload">Loading…</span></div></div>`).join('') || '<div class="empty">No channels here.</div>'}</div>
  ${E.list.length > E.limit ? `<button class="btn more" data-act="epgMore">Show more channels</button>` : ''}`;
};
AFTER.epg = () => loadGuide(E.list.slice(0, E.limit));
ACT.epgCat = d => { E.cat = d.id; E.limit = 30; render(); };
ACT.epgMore = () => { const from = E.limit; E.limit += 30; render(); loadGuide(E.list.slice(from, E.limit)); };
async function loadGuide(items) {
  const token = ++guideToken; let n = 0;
  const work = async () => {
    while (n < items.length) {
      if (token !== guideToken || CUR.v !== 'epg') return;
      const it = items[n++];
      const list = await getEpg(it.id);
      const box = document.getElementById('g-' + it.id);
      if (box) box.innerHTML = progsHtml(it, list);
    }
  };
  await Promise.all(Array.from({ length: 6 }, work));
}
function progsHtml(it, list) {

  const now = Date.now() / 1000;

  /* ---- EBML reading ---- */
  function vint(b, o, isId) {
    if (o >= b.length) return null;
    const f = b[o];
    if (!f) return { bad: true };
    let len = 1, m = 0x80;

function zap(dir) { if (!PC || PC.kind !== 'live' || !PC.list || PC.list.length < 2) return; zapTo((PC.index + dir + PC.list.length) % PC.list.length); }
function zapNumber(n) { const l = PC.list || []; let idx = l.findIndex(x => x.num === n); if (idx < 0 && n >= 1 && n <= l.length) idx = n - 1; if (idx >= 0) zapTo(idx); else showZap(`No channel ${n}`); }
ACT.pPrev = () => zap(-1);
ACT.pNext = () => zap(1);
ACT.pNum = () => openSheet(`<h3>Go to channel number</h3><input type="number" id="numIn" inputmode="numeric" min="1" data-enter="pNumGo"><button class="btn primary big" data-act="pNumGo">Go</button>`) || setTimeout(() => $('#numIn') && $('#numIn').focus(), 50);
ACT.pNumGo = () => { const n = +$('#numIn').value; closeSheet(); if (n) zapNumber(n); };
ACT.pStartOver = async () => {
  const it = PC.item, list = await getEpg(it.id), now = Date.now() / 1000;
  const cur = list.find(p => p.start <= now && p.stop > now);
  if (!cur) return toast('There’s no guide info for this channel, so start over isn’t available.');
  playCatch(it, cur, 'Start over');
};
ACT.pRew = () => { try { pv.currentTime = Math.max(0, pv.currentTime - 10); } catch {} };
ACT.pFwd = () => { try { pv.currentTime = Math.min(pv.duration || Infinity, pv.currentTime + 10); } catch {} };
ACT.pNextEp = () => nextEp();
ACT.pAspect = () => { const keys = Object.keys(ASPECTS); ASPECT = keys[(keys.indexOf(ASPECT) + 1) % keys.length]; pv.style.objectFit = ASPECT; renderTools(); toast(`Picture: ${ASPECTS[ASPECT]}`); };
ACT.pAudio = () => {
  if (pv._mkv && pv._mkv.audioList.length) {
    const cur = pv._mkv.audioNum;
    openSheet(`<h3>Audio language</h3>${pv._mkv.audioList.map(a => a.ok ? opt('setMkvAudio', 'audio', a.label, `data-n="${a.num}"`, a.num === cur) : `<button class="opt" disabled style="opacity:.5">${icon('audio')}<span>${esc(a.label)} (can’t play in a browser)</span></button>`).join('')}`);
    return;
  }
  const o = [];
  if (pv._hls) pv._hls.audioTracks.forEach((t, i) => o.push({ i, l: t.name || t.lang || `Track ${i + 1}`, on: pv._hls.audioTrack === i }));
  else if (pv.audioTracks) for (let i = 0; i < pv.audioTracks.length; i++) { const t = pv.audioTracks[i]; o.push({ i, l: t.label || t.language || `Track ${i + 1}`, on: t.enabled }); }
  openSheet(`<h3>Audio language</h3>${o.length > 1 ? o.map(x => opt('setAudio', 'audio', x.l, `data-i="${x.i}"`, x.on)).join('') : '<p class="note">This video has only one audio track.</p>'}`);
};
ACT.setMkvAudio = d => { const n = +d.n; closeSheet(); if (!PC || (pv._mkv && pv._mkv.audioNum === n)) return; const t = pv.currentTime; toast('Switching audio…'); openPlayer({ ...PC, mkvAudio: n, startAt: t, resume: false }); };
ACT.setAudio = d => { const i = +d.i; if (pv._hls) pv._hls.audioTrack = i; else if (pv.audioTracks) for (let k = 0; k < pv.audioTracks.length; k++) pv.audioTracks[k].enabled = k === i; closeSheet(); toast('Audio changed'); };
ACT.pSubs = () => {
  const o = [];
  if (pv._hls) pv._hls.subtitleTracks.forEach((t, i) => o.push({ i, l: t.name || t.lang || `Subtitles ${i + 1}`, on: pv._hls.subtitleTrack === i }));
  else for (let i = 0; i < pv.textTracks.length; i++) { const t = pv.textTracks[i]; if (t.kind === 'subtitles' || t.kind === 'captions') o.push({ i, l: t.label || t.language || `Subtitles ${i + 1}`, on: t.mode === 'showing' }); }
  openSheet(`<h3>Subtitles</h3>${o.length ? opt('setSub', 'close', 'Off', 'data-i="-1"', !o.some(x => x.on)) + o.map(x => opt('setSub', 'cc', x.l, `data-i="${x.i}"`, x.on)).join('') : '<p class="note">This video has no subtitles.</p>'}`);
};
ACT.setSub = d => { const i = +d.i; if (pv._hls) { pv._hls.subtitleDisplay = i >= 0; pv._hls.subtitleTrack = i; } else for (let k = 0; k < pv.textTracks.length; k++) pv.textTracks[k].mode = k === i ? 'showing' : 'disabled'; closeSheet(); toast(i >= 0 ? 'Subtitles on' : 'Subtitles off'); };
ACT.pSleep = () => openSheet(`<h3>Sleep timer</h3><p class="note">Playback stops after the time you pick.</p>${[0, 15, 30, 60, 90, 120].map(m => opt('setSleep', 'moon', m ? `${m} minutes` : 'Off', `data-m="${m}"`)).join('')}`);
ACT.setSleep = d => {
  const m = +d.m; clearTimeout(sleepT); sleepT = null; closeSheet();
  if (m) { sleepEnd = Date.now() + m * 60000; sleepT = setTimeout(() => { sleepT = null; pv.pause(); if (PC) closePlayer(false); toast('Sleep timer stopped playback'); }, m * 60000); toast(`Stopping in ${m} minutes`); }
  else toast('Sleep timer off');
  if (PC) renderTools();
};
ACT.pPip = async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else if (pv.requestPictureInPicture) await pv.requestPictureInPicture();
    else if (pv.webkitSetPresentationMode) pv.webkitSetPresentationMode(pv.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
  } catch { toast('Mini player isn’t available for this video.'); }
};
ACT.pAir = () => { try { pv.webkitShowPlaybackTargetPicker(); } catch { toast('AirPlay isn’t available here.'); } };
ACT.pFull = () => {
  const st = $('#pStage');
  if (document.fullscreenElement) return document.exitFullscreen();
  if (st.requestFullscreen) st.requestFullscreen().catch(() => pv.webkitEnterFullscreen && pv.webkitEnterFullscreen());
  else if (pv.webkitEnterFullscreen) pv.webkitEnterFullscreen();
};

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el.dataset, el, e);
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.input; if (k && INPUT[k]) INPUT[k](e.target.value, e.target); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.change; if (k && CHANGE[k]) CHANGE[k](e.target.value, e.target); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); const f = ACT[e.target.dataset.enter]; f && f({}, e.target); return; }
  if (e.key === 'Escape' && !$('#sheet').classList.contains('hidden')) { closeSheet(); return; }
  if ($('#player').classList.contains('hidden') || !PC || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'Escape') return closePlayer(false);
  if (PC.kind === 'live') {
    if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); return zap(-1); }
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); return zap(1); }
    if (/^\d$/.test(e.key)) { zapBuf += e.key; showZap(zapBuf); clearTimeout(zapT); zapT = setTimeout(() => { const n = +zapBuf; zapBuf = ''; zapNumber(n); }, 1500); }
  } else {
    if (e.key === 'ArrowLeft') ACT.pRew();
    if (e.key === 'ArrowRight') ACT.pFwd();
  }
  if (e.key === ' ') { e.preventDefault(); pv.paused ? pv.play() : pv.pause(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(true); });

/* ---------- start ---------- */
(async () => {
  const temps = S.accounts.filter(x => x.temp);
  if (temps.length) {
    for (const t of temps) { delete S.data[t.id]; idb.del('lib:' + t.id); }
    S.accounts = S.accounts.filter(x => !x.temp);
    if (!acc()) S.active = null;
    save();
  }
  const a = acc();
  if (!a) return showLogin();
  showLoading('Loading your lists…');
  const lib = await idb.get('lib:' + a.id);
  hideLoading();
  if (lib) { setLib(lib); home(); bgRefresh(); }
  else { CUR = { v: 'login', p: {} }; render(); await activate(a, true); }
})();
</script>
</body>
